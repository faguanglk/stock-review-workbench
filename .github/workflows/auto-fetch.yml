name: Auto Fetch Stock Data
on:
  # 每天北京时间 9:30 运行（UTC 01:30）
  schedule:
    - cron: '30 1 * * *'
  # 支持手动点击运行
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: Run fetch script
        run: python python/fetch_stock.py

      - name: Commit & Push
        run: |
          git config --global user.name "faguanglk"
          git config --global user.email "175324540@qq.com"
          git add .
          git commit -m "🤖 Actions自动更新行情 $(date +%Y%m%d)"
          git push
